const MD=[['Chỉ chữ Hán','zh','你好'],['Hán + Pinyin','zh,py','你好 · nǐ hǎo'],['Hán + Dịch','zh,vi','你好 · Xin chào'],['Hán + Pinyin + Dịch','zh,py,vi','你好 · nǐ hǎo · Xin chào'],['Pinyin + Dịch (ẩn chữ Hán)','py,vi','nǐ hǎo · Xin chào']];

paste(){openSh(`<h2 style="margin-top:0">Dán văn bản</h2><label>Tên<input id=nt placeholder="Ví dụ: Bài đọc 1"></label><label>Đoạn tiếng Trung<textarea id=pt class=mi rows=6 style="padding:10px"></textarea></label><p class=note>App tách câu, tạo pinyin và đọc bằng giọng đọc của trình duyệt.</p><div class=r style="margin-top:12px"><button data-a=cl>Huỷ</button><button class=pri style="flex:1" data-a=savetx>Lưu vào thư viện</button></div>`)},
savetx(){const t=$('pt').value.trim(),ss=t.replace(/([。！？!?；\n])/g,'$1\u0001').split('\u0001').map(x=>x.trim()).filter(x=>/[\u4e00-\u9fff]/.test(x));
if(!ss.length){toast('Hãy dán đoạn có chữ Hán.');return}
items.unshift({id:'i'+Date.now(),title:$('nt').value.trim()||ss[0].slice(0,12),demo:1,cues:ss.map((z,i)=>({s:i*4,e:i*4+3.5,zh:z,py:py(z),vi:''}))});sI();closeSh();render();toast('Đã thêm vào thư viện')},
async save(){const z=$('nz').files[0],f=$('nm').files[0],v=$('nv').files[0],say=t=>{const e=$('asr');if(e)e.textContent=t};let cues;
if(z)cues=parse(await z.text()).map(c=>({s:c.s,e:c.e,zh:c.t,py:py(c.t),vi:''}));
else if(f){if(asrBusy)return;asrBusy=1;try{cues=await transcribe(f,$('nq').value,say)}catch(e){say('Không nhận dạng được: '+(e&&e.message?e.message:e));asrBusy=0;return}asrBusy=0}
else{toast('Chọn file audio/video hoặc file phụ đề.');return}
if(!cues||!cues.length){say('Không thấy lời thoại tiếng Trung. Thử mức chất lượng cao hơn hoặc file rõ tiếng hơn.');return}
if(v){const vr=parse(await v.text());cues.forEach(c=>{let b=null,d=1e9;vr.forEach(x=>{const k=Math.abs(x.s-c.s);if(k<d){d=k;b=x}});c.vi=b&&d<2?b.t:''})}
const id='i'+Date.now();if(f)await idb('put',id,f);
items.unshift({id,title:$('nt').value.trim()||(z||f).name.replace(/\.\w+$/,''),cues,m:!!f});sI();closeSh();render();toast('Đã thêm vào thư viện')},
diag(){diag()}};
const C={q(el){Q=el.value;drawLib()},seek(el){m.currentTime=+el.value},rate(el){rate=+el.value;if(P&&P.media)m.playbackRate=rate},

['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const c=e.target.dataset&&e.target.dataset.c;if(c&&C[c])C[c](e.target)}));
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){const had=navigator.serviceWorker.controller;let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=1;location.reload()}});navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})}
applyS();render();
